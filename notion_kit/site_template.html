<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOSPI 리스크 전광판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 전광판 토큰 — 검정 바탕 위 앰버 LED, 상승 녹색 ▲ / 하락 적색 ▼ (월가 표기) */
:root {
  --led: #FFB000; --led-dim: #A88E5C; --ink: #F3E6C8; --up: #39E07A; --down: #FF4D4D;
  --color-fg: #F3E6C8; --color-fg-muted: #A88E5C; --color-bg: #000000; --color-panel: #080706; --color-border-line: rgba(255, 176, 0, .18);
  --color-ok: #39E07A; --color-warn: #FFA31A; --color-bad: #FF4D4D;
  --c1: #C78600; --c2: #CF4A95; --c3: #1993C4; --c4: #2FA36B; --c5: #8E6BD8; --c6: #9AA83A; --c7: #C77B4A; --c8: #4F8FA8;
  --cds-chart-grid: rgba(255, 176, 0, .10); --cds-chart-axis: rgba(255, 176, 0, .35); --cds-chart-reference: #8C7448; --cds-chart-muted: #3A3020; --cds-chart-status-critical: #FF4D4D;
  --cds-surface-popover: #0E0C09; --cds-border: rgba(255, 176, 0, .40); --cds-shadow-popover: 0 0 18px rgba(255, 176, 0, .12); --cds-text-secondary: #A88E5C;
  --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 15px; --cds-font-size-title: 26px; --cds-font-weight-medium: 500;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px; --cds-gap-xl: 32px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px; --cds-radius: 3px; --cds-dur-slow: .4s;
  --font-sans: "IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-led: "Doto", "DotGothic16", "VT323", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-serif: var(--font-led);
  color-scheme: dark;
}
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); }
body { padding: 0 0 40px; -webkit-text-size-adjust: 100%; }
.mrm { padding: 0 clamp(16px, 3vw, 36px); box-sizing: border-box; }
.mrm { max-width: 1400px; margin-inline: auto; }
.mrm { font-family: var(--font-sans); color: var(--color-fg); display: flex; flex-direction: column; gap: var(--cds-gap-lg); }
.mrm h1 { font-family: var(--font-sans); font-weight: 700; font-size: 22px; letter-spacing: -.01em; margin: 0; color: var(--led); text-shadow: 0 0 12px rgba(255, 176, 0, .35); }
.mrm-take { margin: var(--cds-gap-xs) 0 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-body); max-width: 78ch; line-height: 1.55; }
.mrm-stamp { margin: var(--cds-gap-xs) 0 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.mrm-take b, .mrm-sub b { font-weight: var(--cds-font-weight-medium); color: var(--color-fg); }
.mrm-tabs { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); border-bottom: 1px solid var(--color-border-line); }
.mrm-tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: var(--cds-pad-sm) var(--cds-pad-md); font: inherit; font-size: var(--cds-font-size-body); color: var(--color-fg-muted); cursor: pointer; }
.mrm-tab[aria-selected="true"] { color: var(--led); border-bottom-color: var(--led); }
.mrm-tab:focus-visible, .mrm-seg button:focus-visible, .mrm a:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
.mrm-page { display: flex; flex-direction: column; gap: var(--cds-gap-lg); }
.mrm-page[hidden] { display: none; }
.mrm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: var(--cds-gap-md); }
.mrm-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.5rem), 1fr)); gap: var(--cds-gap-md); }
.mrm-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); min-width: 0; position: relative; }
.mrm-card h3, .mrm h2, .bd-panel h3 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); color: var(--led); }
.mrm h2 { margin-top: var(--cds-gap-sm); }
.mrm-note { margin: var(--cds-gap-xs) 0 var(--cds-gap-md); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.5; }
.mrm-kpi .lab { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.mrm-kpi .big { font-family: var(--font-led); font-weight: 800; color: var(--led); font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; line-height: 1.2; margin: var(--cds-gap-xs) 0; min-height: 1.2em; }
.mrm-kpi .sub { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); font-variant-numeric: tabular-nums; line-height: 1.5; }
.mrm .bad { color: var(--color-bad); } .mrm .ok { color: var(--color-ok); } .mrm .warn { color: var(--color-warn); }
.mrm-banner { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-md) var(--cds-gap-lg); }
.mrm-regime { font-family: var(--font-sans); font-weight: 700; font-size: var(--cds-font-size-title); padding: var(--cds-pad-xs) var(--cds-pad-md); border-radius: var(--cds-radius); border: 1.5px solid currentColor; line-height: 1.2; min-width: 4ch; text-align: center; }
.mrm-banner .meta { display: flex; flex-direction: column; gap: 2px; font-size: var(--cds-font-size-body); font-variant-numeric: tabular-nums; }
.mrm-banner .meta .cap { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.mrm-gauge { flex: 1 1 18rem; min-width: 14rem; min-height: 54px; }
.mrm-chart { width: 100%; position: relative; }
.mrm-bars { display: flex; flex-direction: column; gap: var(--cds-gap-sm); min-height: 200px; }
.mrm-bar-row { display: grid; grid-template-columns: minmax(6.5rem, 8.5rem) 1fr 3.4rem; align-items: center; gap: var(--cds-gap-sm); font-size: var(--cds-font-size-caption); }
.mrm-bar-row .nm { color: var(--color-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrm-bar-row .val { text-align: right; font-variant-numeric: tabular-nums; }
.mrm-track { position: relative; height: 12px; border-radius: 6px; background: var(--cds-chart-grid); }
.mrm-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.mrm-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--color-fg); opacity: .55; border-radius: 1px; }
.mrm-axis-head { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-top: var(--cds-gap-xs); }
.mrm-legend { display: flex; flex-wrap: wrap; gap: var(--cds-gap-md); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-bottom: var(--cds-gap-sm); }
.mrm-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.mrm-seg { display: inline-flex; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden; }
.mrm-seg button { appearance: none; border: 0; background: none; font: inherit; font-size: var(--cds-font-size-caption); padding: var(--cds-pad-xs) var(--cds-pad-sm); color: var(--color-fg-muted); cursor: pointer; }
.mrm-seg button[aria-pressed="true"] { background: var(--color-bg); color: var(--color-fg); }
.mrm-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--cds-gap-sm); }
.mrm-wrap { max-height: 28rem; overflow: auto; }
table.mrm-t { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; }
.mrm-t th { position: sticky; top: 0; z-index: 1; background: var(--color-panel); text-align: left; font-weight: var(--cds-font-weight-medium); color: var(--color-fg-muted); padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
.mrm-t td { padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); vertical-align: top; }
.mrm-t .num { text-align: right; white-space: nowrap; }
.mrm-t th button { all: unset; cursor: pointer; }
.mrm-t th button:focus-visible { outline: 2px solid var(--color-fg); }
.mrm-cellbar { display: inline-block; height: 8px; border-radius: 4px; margin-right: 6px; vertical-align: 0; }
.mrm-pill { display: inline-block; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; font-size: var(--cds-font-size-caption); white-space: nowrap; }
.mrm-search { font: inherit; font-size: var(--cds-font-size-caption); padding: var(--cds-pad-xs) var(--cds-pad-sm); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); color: var(--color-fg); min-width: 12rem; }
.mrm-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 3; }
.mrm-tip .d { color: var(--cds-text-secondary); margin-bottom: 2px; }
.mrm-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.mrm-fail { display: flex; align-items: center; justify-content: center; gap: .45rem; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); min-height: inherit; text-decoration: none; }
.mrm-fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }
.mrm-method { max-width: 80ch; font-size: var(--cds-font-size-body); line-height: 1.65; }
.mrm-method h3 { margin: var(--cds-gap-lg) 0 var(--cds-gap-xs); }
.mrm-method p, .mrm-method li { color: var(--color-fg); }
.mrm-method ul { padding-left: 1.2rem; margin: var(--cds-gap-xs) 0; }
.mrm-method code { font-size: var(--cds-font-size-caption); background: var(--color-bg); padding: 1px 4px; border-radius: 4px; }
@media (max-width: 40rem) { .mrm-hide-narrow { display: none; } }

/* ---------- 전광판 ---------- */
.tv-tape { position: relative; min-height: 46px; border-bottom: 1px solid var(--color-border-line); background: #000; }
.board-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--cds-gap-md) var(--cds-gap-xl); padding-top: var(--cds-gap-lg); }
.bh-title .mrm-stamp { color: var(--led-dim); }
.bh-clocks { display: flex; border: 1px solid var(--color-border-line); }
.clk { display: grid; grid-template-columns: auto auto; column-gap: 10px; padding: 6px 12px; border-left: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); color: var(--led-dim); }
.clk:first-child { border-left: 0; }
.clk-time { grid-row: span 2; font-family: var(--font-led); font-weight: 800; font-size: 26px; line-height: 1; color: var(--led); font-variant-numeric: tabular-nums; letter-spacing: .02em; align-self: center; }
.clk-state.on { color: var(--up); }
.clk-state.on::before { content: "● "; }
.bd-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.6fr); border: 1px solid var(--color-border-line);
  background: radial-gradient(circle at 1px 1px, rgba(255, 176, 0, .07) 1px, transparent 1.4px) 0 0 / 6px 6px, #000; }
.bd-regime { padding: var(--cds-pad-lg) clamp(16px, 2.4vw, 28px); border-right: 1px solid var(--color-border-line); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.bd-cap { font-size: var(--cds-font-size-caption); color: var(--led-dim); }
.bd-regime-word { font-family: var(--font-sans); font-weight: 700; font-size: clamp(72px, 11vw, 148px); line-height: .95; letter-spacing: -.02em; margin: 6px 0 10px; color: var(--regime, #FFB000);
  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--regime, #FFB000) 60%, transparent)); }
.dotmask { -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 68%); -webkit-mask-size: 5px 5px; mask-image: radial-gradient(circle, #000 62%, transparent 68%); mask-size: 5px 5px; }
.bd-regime-line { font-size: var(--cds-font-size-body); line-height: 1.6; color: var(--ink); max-width: 46ch; margin: 0; }
.bd-regime-line b { color: var(--led); font-weight: 500; }
.bd-counters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ctr { padding: var(--cds-pad-md) var(--cds-pad-lg); border-left: 1px solid var(--color-border-line); border-top: 1px solid var(--color-border-line); min-width: 0; }
.ctr:nth-child(3n+1) { border-left: 0; }
.ctr:nth-child(-n+3) { border-top: 0; }
.ctr-lab { font-size: var(--cds-font-size-caption); color: var(--led-dim); }
.ctr-num { font-family: var(--font-led); font-weight: 900; font-size: clamp(34px, 4.2vw, 54px); line-height: 1.05; color: var(--led); font-variant-numeric: tabular-nums; margin: 4px 0 2px; text-shadow: 0 0 14px rgba(255, 176, 0, .30); white-space: nowrap; }
.ctr-sub { font-size: var(--cds-font-size-caption); color: var(--led-dim); font-variant-numeric: tabular-nums; }
.mrm .up { color: var(--up); } .mrm .down { color: var(--down); }
.bd-crawl { overflow: hidden; border: 1px solid var(--color-border-line); border-top: 0; background: #000; height: 38px; display: flex; align-items: center; margin-top: calc(-1 * var(--cds-gap-lg)); }
.bd-crawl-track { display: inline-flex; gap: 48px; white-space: nowrap; padding-left: 100%; animation: crawl var(--crawl-dur, 90s) linear infinite; font-size: 14px; color: var(--led); }
.bd-crawl:hover .bd-crawl-track { animation-play-state: paused; }
.bd-crawl-track span.tag { color: var(--led-dim); margin-right: 8px; }
.bd-crawl-track .hi { color: var(--down); } .bd-crawl-track .md { color: var(--color-warn); }
@keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .bd-crawl { overflow-x: auto; } .bd-crawl-track { animation: none; padding-left: 12px; } }
.bd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: var(--cds-gap-md); }
.bd-grid-main { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
@media (max-width: 64rem) { .bd-grid-main { grid-template-columns: 1fr; } .bd-hero { grid-template-columns: 1fr; } .bd-regime { border-right: 0; border-bottom: 1px solid var(--color-border-line); } }
@media (max-width: 34rem) {
  .bd-counters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ctr:nth-child(n) { border-left: 1px solid var(--color-border-line); border-top: 1px solid var(--color-border-line); }
  .ctr:nth-child(2n+1) { border-left: 0; } .ctr:nth-child(-n+2) { border-top: 0; }
  .clk { padding: 6px 8px; column-gap: 6px; } .clk-time { font-size: 19px; }
}
.bd-panel { border: 1px solid var(--color-border-line); background: var(--color-panel); padding: var(--cds-pad-md) var(--cds-pad-lg) var(--cds-pad-lg); min-width: 0; position: relative; }
.bd-ph { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: var(--cds-gap-sm); }
.bd-ph .bd-note { font-size: var(--cds-font-size-caption); color: var(--led-dim); }
.tvw { position: relative; width: 100%; height: 480px; }
.tvw[data-widget="advanced"], .tvw[data-widget="overview"] { height: 540px; }
.tvw[data-widget="calendar"] { height: 420px; }
@media (max-width: 40rem) { .tvw { height: 380px; } .tvw[data-widget="advanced"] { height: 420px; } .tvw[data-widget="overview"] { height: 460px; } }
.tvw .tradingview-widget-copyright, .tv-tape .tradingview-widget-copyright { display: none; }
.tvw-fail { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px 24px; color: var(--led-dim); font-size: var(--cds-font-size-caption); line-height: 1.6; }
.led-t { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-body); table-layout: auto; }
.led-t td { padding: 7px 4px; border-bottom: 1px solid rgba(255, 176, 0, .10); white-space: nowrap; }
.led-t td.nm { color: var(--ink); overflow: hidden; text-overflow: ellipsis; max-width: 12rem; }
.led-t td.px, .led-t td.ch, .led-t td.wt { text-align: right; font-family: var(--font-led); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.led-t td.px { color: var(--led); }
.led-t td.wt { color: var(--led-dim); font-size: 15px; }
.led-t tr.sep td { padding: 12px 4px 4px; border-bottom: 0; font-size: var(--cds-font-size-caption); color: var(--led-dim); font-family: var(--font-sans); }
.breadth { margin: 2px 0 10px; }
.breadth-bar { display: flex; gap: 2px; height: 10px; margin: 6px 0 4px; }
.breadth-bar i { display: block; height: 100%; border-radius: 1px; }
.breadth-lab { display: flex; justify-content: space-between; font-size: var(--cds-font-size-caption); color: var(--led-dim); font-variant-numeric: tabular-nums; }
.news { list-style: none; margin: 0; padding: 0; max-height: 480px; overflow: auto; }
.news li { display: grid; grid-template-columns: 3.4rem 1fr; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid rgba(255, 176, 0, .10); }
.news .t { font-family: var(--font-led); font-weight: 800; font-size: 16px; color: var(--led); grid-row: span 2; padding-top: 1px; font-variant-numeric: tabular-nums; }
.news a { color: var(--ink); text-decoration: none; line-height: 1.45; }
.news a:hover { color: var(--led); text-decoration: underline; }
.news .src { font-size: var(--cds-font-size-caption); color: var(--led-dim); }
.news-empty { color: var(--led-dim); font-size: var(--cds-font-size-caption); padding: 16px 0; }
.tv-attrib { font-size: var(--cds-font-size-caption); color: var(--led-dim); margin: 0; line-height: 1.6; max-width: 90ch; }
.tv-attrib a { color: var(--led); }
</style>
</head>
<body>

<div class="tv-tape" id="tv-tape" aria-label="실시간 시세 흐름"></div>
<div class="mrm">
  <header class="mrm-head board-head">
    <div class="bh-title">
      <h1 id="top">KOSPI 리스크 전광판</h1>
      <p class="mrm-stamp" id="stamp"></p>
    </div>
    <div class="bh-clocks" aria-label="주요 시장 시각">
      <div class="clk" data-tz="Asia/Seoul" data-open="09:00" data-close="15:30"><span class="clk-time">--:--</span><span>서울</span><span class="clk-state">—</span></div>
      <div class="clk" data-tz="America/New_York" data-open="09:30" data-close="16:00"><span class="clk-time">--:--</span><span>뉴욕</span><span class="clk-state">—</span></div>
      <div class="clk" data-tz="Europe/London" data-open="08:00" data-close="16:30"><span class="clk-time">--:--</span><span>런던</span><span class="clk-state">—</span></div>
    </div>
  </header>

  <nav class="mrm-tabs" role="tablist" aria-label="페이지">
    <button class="mrm-tab" role="tab" data-tab="board" id="tab-board">전광판</button>
    <button class="mrm-tab" role="tab" data-tab="now" id="tab-now">현재 판독</button>
    <button class="mrm-tab" role="tab" data-tab="history" id="tab-history">이력</button>
    <button class="mrm-tab" role="tab" data-tab="validation" id="tab-validation">검증</button>
    <button class="mrm-tab" role="tab" data-tab="method" id="tab-method">방법론</button>
  </nav>

  <section class="mrm-page" id="board" hidden></section>
  <section class="mrm-page" id="now" hidden></section>
  <section class="mrm-page" id="history" hidden></section>
  <section class="mrm-page" id="validation" hidden></section>
  <section class="mrm-page" id="method" hidden></section>
</div>

<template id="tpl-board">
  <div class="bd-hero" id="bd-hero">
    <div class="bd-regime">
      <div class="bd-cap">시장 리스크 레짐 <span id="bd-asof"></span></div>
      <div class="bd-regime-word dotmask" id="bd-regime">—</div>
      <p class="bd-regime-line" id="bd-line">—</p>

/* 아티팩트 런타임(dash) 대신 이 파일에 들어 있는 데이터를 읽는 최소 구현 */
(function () {
  var q = new URLSearchParams(location.search);
  var th = q.get('theme');
  if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  var RAW = JSON.parse(document.getElementById('mrm-data').textContent);
  var cache = {}, fns = [];
  window.dash = {
    data: function (id) {
      if (!(id in cache)) {
        var t = RAW.tables[id];
        if (!t) return { status: 'missing', data: [] };
        cache[id] = t.rows.map(function (r) { var o = {}; t.columns.forEach(function (c, i) { o[c] = r[i]; }); return o; });
      }
      return { status: 'ok', data: cache[id] };
    },
    calc: function (id, o) { cache[id] = o.fn.apply(null, o.inputs.map(function (i) { return window.dash.data(i).data; })); },
    colors: ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)', 'var(--c8)'],
    onData: function (fn) { fns.push(fn); fn(); },
    setLink: function (id) { try { history.replaceState(null, '', location.search + '#' + id); } catch (e) {} },
    meta: RAW.meta,
  };
  var lastW = 0, timer = null;
  new ResizeObserver(function () {
    var w = document.body.clientWidth;
    if (Math.abs(w - lastW) < 2) return;
    lastW = w;
    clearTimeout(timer);
    timer = setTimeout(function () { fns.forEach(function (f) { f(); }); }, 120);
  }).observe(document.body);
})();

<script>
(function () {

    fn: (kpi) => kpi.map((r) => ({

    fn: (top_holdings) => [{ share: top_holdings.slice(0, 2).reduce((a, r) => a + +r.weight, 0) }],

  // ---------- helpers ----------
  function failLine(el) {

      const d = document.createElement('div');

      el.appendChild(d);

  function gate(el, ids) {

    if (ds.every((d) => d.status === 'ok')) {
      el.classList.remove('dash-skeleton');
      el.querySelector(':scope > .mrm-fail')?.remove();

    }
    el.querySelectorAll(':scope > svg, :scope > .mrm-tip').forEach((n) => n.remove());
    if (el.classList.contains('mrm-bars')) el.replaceChildren();
    if (ds.some((d) => d.status === 'error' || d.status === 'connect' || d.status === 'declined' || d.status === 'missing')) {

  function setAll(root, sel, text) { root.querySelectorAll(sel).forEach((n) => { n.textContent = text; }); }

    const t = svg.append('text').attr('class', cls || '').attr('font-size', 'var(--cds-font-size-caption)').text(str);

  function tipFor(el) {

  function placeTip(el, tip, px, py) {
    tip.hidden = false;
    const W = el.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 12; if (left + tw > W) left = px - tw - 12; if (left < 0) left = 0;
    let top = py - th - 8; if (top < 0) top = py + 12;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  function tipLine(parent, color, name, val) {
    const row = document.createElement('div');
    if (color) { const i = document.createElement('i'); i.style.background = color; row.appendChild(i); }
    row.appendChild(document.createTextNode(name + ' ' + val));
    parent.appendChild(row);
  }
  function sortRows(rows, key, dir) {
    return rows.slice().sort((a, b) => {
      const x = N(a[key]), y = N(b[key]);
      let c;
      if (ok(x) && ok(y)) c = x - y; else if (ok(x)) c = -1; else if (ok(y)) c = 1; else c = String(a[key] ?? '').localeCompare(String(b[key] ?? ''), 'ko');
      return dir === 'asc' ? c : -c;

  }

    const W = Math.max(280, el.clientWidth), H = o.height || 240;

    if (!rows.length) return;

      .attr('font-family', 'var(--font-sans)').style('display', 'block');

    const y = o.log ? d3.scaleLog().domain(dom) : d3.scaleLinear().domain(dom);
    if (!o.y && !o.log) y.nice(4);
    let ticks;
    if (o.log) {
      const cand = [100, 200, 300, 500, 1000, 1500, 2000, 3000, 4000, 6000, 8000, 10000, 15000];
      ticks = cand.filter((t) => t >= y.domain()[0] && t <= y.domain()[1]);

    const yf = o.yFmt || f1;
    const ml = Math.ceil(d3.max(ticks, (t) => textW(svg, yf(t)))) + 10;
    const last = (s) => { for (let i = rows.length - 1; i >= 0; i--) if (ok(rows[i][s.key])) return rows[i]; return null; };
    const endLabels = o.series.map((s) => { const r = last(s); return r ? { s, r, txt: `${s.label} ${s.fmt ? s.fmt(r[s.key]) : yf(r[s.key])}` } : null; }).filter(Boolean);
    const mr = (o.endLabels === false ? 8 : Math.ceil(d3.max(endLabels, (e) => textW(svg, e.txt)) || 0) + 14);
    const mt = 10, mb = 24;
    y.range([H - mb, mt]);
    const x = d3.scaleUtc().domain(d3.extent(rows, (r) => r.date)).range([ml, W - mr]);
    const spanY = (x.domain()[1] - x.domain()[0]) / (365.25 * 864e5);
    const xf = spanY > 4 ? d3.utcFormat('%Y') : (spanY > 1.2 ? d3.utcFormat('%Y.%m') : d3.utcFormat('%m/%d'));
    const xt = x.ticks(Math.max(2, Math.floor((W - ml - mr) / 80)));
    // regime bands
    if (o.bands) {
      let start = 0;
      for (let i = 1; i <= rows.length; i++) {
        if (i === rows.length || rows[i].regime !== rows[start].regime) {
          const x0 = x(rows[start].date), x1 = i < rows.length ? x(rows[i].date) : x(rows[rows.length - 1].date);
          svg.append('rect').attr('x', x0).attr('y', mt).attr('width', Math.max(0, x1 - x0)).attr('height', H - mb - mt)
            .style('fill', regColor(rows[start].regime)).attr('fill-opacity', 0.14);
          start = i;
        }
      }
    }
    svg.append('g').selectAll('line').data(ticks).join('line').attr('x1', ml).attr('x2', W - mr).attr('y1', (t) => y(t)).attr('y2', (t) => y(t))
      .style('stroke', 'var(--cds-chart-grid)').attr('stroke-width', 1);
    svg.append('g').selectAll('text').data(ticks).join('text').attr('x', ml - 6).attr('y', (t) => y(t)).attr('dy', '0.32em').attr('text-anchor', 'end')
      .attr('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)').text((t) => yf(t));
    svg.append('line').attr('x1', ml).attr('x2', W - mr).attr('y1', H - mb).attr('y2', H - mb).style('stroke', 'var(--cds-chart-axis)');
    svg.append('g').selectAll('text').data(xt).join('text').attr('x', (t) => x(t)).attr('y', H - 6).attr('text-anchor', 'middle')
      .attr('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)').text((t) => xf(t));
    (o.refs || []).forEach((rf) => {
      if (!ok(rf.y) || rf.y < y.domain()[0] || rf.y > y.domain()[1]) return;
      svg.append('line').attr('x1', ml).attr('x2', W - mr).attr('y1', y(rf.y)).attr('y2', y(rf.y))
        .style('stroke', rf.color || 'var(--cds-chart-reference)').attr('stroke-dasharray', '4 4').attr('stroke-width', 1);
      svg.append('text').attr('x', ml + 4).attr('y', y(rf.y) - 4).attr('font-size', 'var(--cds-font-size-caption)')
        .style('fill', rf.color || 'var(--color-fg-muted)').text(rf.label);
    });
    o.series.forEach((s) => {
      const line = d3.line().defined((r) => ok(r[s.key])).x((r) => x(r.date)).y((r) => y(r[s.key]));
      svg.append('path').datum(rows).attr('d', line).attr('fill', 'none').style('stroke', s.color)
        .attr('stroke-width', s.width || 2).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round').attr('stroke-opacity', s.opacity || 1);
    });
    if (o.endLabels !== false) {
      const lab = endLabels.map((e) => ({ ...e, yy: y(e.r[e.s.key]) })).sort((a, b) => a.yy - b.yy);
      for (let i = 1; i < lab.length; i++) if (lab[i].yy - lab[i - 1].yy < 14) lab[i].yy = lab[i - 1].yy + 14;
      lab.forEach((e) => svg.append('text').attr('x', W - mr + 6).attr('y', Math.min(H - mb, e.yy)).attr('dy', '0.32em')
        .attr('font-size', 'var(--cds-font-size-caption)').style('fill', e.s.color).text(e.txt));
    }
    // tooltip
    const tip = tipFor(el);
    const rule = svg.append('line').attr('y1', mt).attr('y2', H - mb).style('stroke', 'var(--cds-chart-axis)').attr('opacity', 0);
    const dots = o.series.map((s) => svg.append('circle').attr('r', 3.5).style('fill', s.color).attr('opacity', 0));
    const bis = d3.bisector((r) => r.date).center;
    svg.append('rect').attr('x', ml).attr('y', mt).attr('width', W - ml - mr).attr('height', H - mb - mt).attr('fill', 'transparent')
      .on('pointermove', (ev) => {
        const [mx, my] = d3.pointer(ev);
        const r = rows[bis(rows, x.invert(mx))];
        if (!r) return;
        rule.attr('x1', x(r.date)).attr('x2', x(r.date)).attr('opacity', 1);
        o.series.forEach((s, i) => { if (ok(r[s.key])) dots[i].attr('cx', x(r.date)).attr('cy', y(r[s.key])).attr('opacity', 1); else dots[i].attr('opacity', 0); });
        tip.replaceChildren();
        const d = document.createElement('div'); d.className = 'd'; d.textContent = r.ds + (r.regime ? ' · ' + r.regime : ''); tip.appendChild(d);
        o.series.forEach((s) => tipLine(tip, o.series.length > 1 ? s.color : null, s.label, s.fmt ? show(r[s.key], s.fmt) : show(r[s.key], yf)));
        const scale = el.clientWidth / W;
        placeTip(el, tip, x(r.date) * scale, my * scale);
      })
      .on('pointerleave', () => { tip.hidden = true; rule.attr('opacity', 0); dots.forEach((d) => d.attr('opacity', 0)); });
  }

  // ---------- history cache ----------
  let HC = { ref: null, rows: [] };
  function histRows() {
    const d = dash.data('history');
    if (d.status !== 'ok') return null;
    if (HC.ref !== d.data) {
      HC.ref = d.data;
      HC.rows = d.data.map((r) => ({
        date: new Date(r.date + 'T00:00:00Z'), ds: r.date, kospi: N(r.kospi), composite: N(r.composite), stress: N(r.stress),
        fragility: N(r.fragility), prob: N(r.prob), vol: N(r.vol_fc), dd: N(r.drawdown), regime: r.regime,
      }));
    }
    return HC.rows;
  }

  // ---------- header ----------
  function drawHeader() {
    const root = document;
    const d = dash.data('kpi');
    const k = d.status === 'ok' ? d.data[0] : null;
    setAll(root, '.k-asof', k ? k.asof : '—');
    setAll(root, '.k-comp', k ? f1(N(k.composite)) : '—');
    setAll(root, '.k-reg', k ? k.regime : '—');
    setAll(root, '.k-st', k ? f1(N(k.stress)) : '—');
    setAll(root, '.k-fr', k ? f1(N(k.fragility)) : '—');
    setAll(root, '.k-quad', k ? k.quadrant : '—');
    const QD = { '위기(Crisis)': '두 축이 모두 높은', '충격(Shock)': '스트레스는 높지만 구조적 취약성은 상대적으로 낮은',
      '취약·안일(Fragile)': '겉보기 스트레스는 낮지만 구조적 취약성이 쌓인', '안정(Calm)': '두 축이 모두 낮은' };
    setAll(root, '.k-quaddesc', k ? (QD[k.quadrant] || '') : '—');
    setAll(root, '.k-pcal', k ? p0(N(k.prob_calibrated)) : '—');
    setAll(root, '.k-base', k ? p0(N(k.base_rate_holdout)) : '—');
    const st = document.getElementById('stamp');
    if (st && dash.meta) st.textContent = `${dash.meta.asof} 장 마감 데이터로 계산, ${dash.meta.generated_at} 생성`;
    root.querySelectorAll('.k-reg').forEach((n) => { n.className = 'k-reg ' + (k ? regClass(k.regime) : ''); });
  }

  // ---------- NOW page ----------
  function drawNow(page) {
    const kd = dash.data('kpi');
    const k = kd.status === 'ok' ? kd.data[0] : null;
    const badge = page.querySelector('#regime-badge');
    badge.textContent = k ? k.regime : '—';
    badge.style.color = k ? regColor(k.regime) : '';
    setAll(page, '.k-idx', k ? cm0(N(k.index_level)) : '—');
    setAll(page, '.k-idxr', k ? sp1(N(k.index_ret_1d)) : '—');
    setAll(page, '.k-dd', k ? p1(N(k.drawdown_1y)) : '—');
    const fmtOf = { composite: f1, stress: f1, fragility: f1, prob_calibrated: p0, prob_model: p0, base_rate_holdout: p0, vol_forecast: p0, var95_21d: p1, var95_1d: p1, var99_1d: p1, es95_1d: p1 };
    page.querySelectorAll('.mrm-kpi [data-source="kpi"]').forEach((n) => {
      const f = n.dataset.field;
      n.textContent = k ? show(N(k[f]), fmtOf[f] || f1) : '—';
    });
    const cd = dash.data('kpi_chg');
    const c = cd.status === 'ok' ? cd.data[0] : null;
    page.querySelectorAll('[data-source="kpi_chg"]').forEach((n) => {
      const v = c ? N(c[n.dataset.field]) : NaN;
      n.textContent = show(v, s1);
      n.className = 'c5 ' + (ok(v) ? (v > 0.05 ? 'bad' : (v < -0.05 ? 'ok' : '')) : '');
    });
    drawGauge(page.querySelector('#gauge'));
    drawCats(page.querySelector('#cat-bars'));
    drawQuad(page.querySelector('#quad'));
    drawAlerts(page.querySelector('#alerts-table'));
    drawHold(page.querySelector('#hold-bars'), page);
    drawSignals(page.querySelector('#sig-table'));
    drawFresh(page.querySelector('#fresh-table'));
  }

  function drawGauge(el) {
    const g = gate(el, ['kpi']);
    if (!g) return;
    const k = g[0].data[0];
    el.querySelectorAll(':scope > svg').forEach((n) => n.remove());
    const W = Math.max(220, el.clientWidth), H = 54, ml = 6, mr = 6, top = 18, bh = 12;
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('height', H).attr('viewBox', `0 0 ${W} ${H}`).style('display', 'block');
    const x = d3.scaleLinear().domain([0, 100]).range([ml, W - mr]);
    const cuts = [0, N(k.cut_watch), N(k.cut_alert), N(k.cut_danger), 100];
    REG.forEach((r, i) => {
      svg.append('rect').attr('x', x(cuts[i])).attr('y', top).attr('width', Math.max(0, x(cuts[i + 1]) - x(cuts[i]) - 1)).attr('height', bh)
        .attr('rx', 3).style('fill', regColor(r)).attr('fill-opacity', 0.35);
      const mid = (x(cuts[i]) + x(cuts[i + 1])) / 2;
      svg.append('text').attr('x', mid).attr('y', top + bh + 14).attr('text-anchor', 'middle').attr('font-size', 'var(--cds-font-size-caption)')
        .style('fill', 'var(--color-fg-muted)').text(r);
    });
    const v = N(k.composite);
    svg.append('path').attr('d', d3.symbol(d3.symbolTriangle, 70)()).attr('transform', `translate(${x(v)},${top - 7}) rotate(180)`).style('fill', 'var(--color-fg)');
    const lbl = '현재 ' + f1(v);
    const lw = textW(svg, lbl);
    svg.append('text').attr('x', Math.min(W - mr - lw / 2, Math.max(ml + lw / 2, x(v)))).attr('y', 9).attr('text-anchor', 'middle')
      .attr('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg)').text(lbl);
  }

  function barRow(parent, name, val, pct, color, tick) {
    const row = document.createElement('div'); row.className = 'mrm-bar-row';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = name; nm.title = name;
    const tr = document.createElement('div'); tr.className = 'mrm-track';
    const fl = document.createElement('div'); fl.className = 'mrm-fill'; fl.style.width = Math.max(0, Math.min(100, pct)) + '%'; fl.style.background = color;
    tr.appendChild(fl);
    if (ok(tick)) { const t = document.createElement('div'); t.className = 'mrm-tick'; t.style.left = `calc(${Math.max(0, Math.min(100, tick))}% - 1px)`; tr.appendChild(t); }
    const vl = document.createElement('div'); vl.className = 'val'; vl.textContent = val;
    row.append(nm, tr, vl);
    parent.appendChild(row);
  }

  function drawCats(el) {
    const g = gate(el, ['categories']);
    if (!g) return;
    el.replaceChildren();
    const rows = g[0].data;
    ['스트레스', '취약성'].forEach((ax, ai) => {
      const h = document.createElement('div'); h.className = 'mrm-axis-head'; h.textContent = ax + ' 축'; el.appendChild(h);
      rows.filter((r) => r.axis === ax).forEach((r) => {
        const v = N(r.score);
        const color = v >= 80 ? 'var(--cds-chart-status-critical)' : dash.colors[ai];
        barRow(el, r.label, show(v, f1), v, color, N(r.score_5d_ago));
      });
    });
  }

  function drawQuad(el) {
    const g = gate(el, ['history', 'kpi']);
    if (!g) return;
    const rows = histRows();
    const k = g[1].data[0];
    el.querySelectorAll(':scope > svg').forEach((n) => n.remove());
    const W = Math.max(260, el.clientWidth), H = 300, ml = 46, mr = 12, mt = 12, mb = 34;
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('height', H).attr('viewBox', `0 0 ${W} ${H}`).style('display', 'block');
    const x = d3.scaleLinear().domain([0, 100]).range([ml, W - mr]);
    const y = d3.scaleLinear().domain([0, 100]).range([H - mb, mt]);
    const sT = N(k.quad_stress_thr), fT = N(k.quad_fragility_thr);
    [0, 25, 50, 75, 100].forEach((t) => {
      svg.append('line').attr('x1', x(t)).attr('x2', x(t)).attr('y1', mt).attr('y2', H - mb).style('stroke', 'var(--cds-chart-grid)');
      svg.append('line').attr('x1', ml).attr('x2', W - mr).attr('y1', y(t)).attr('y2', y(t)).style('stroke', 'var(--cds-chart-grid)');
      svg.append('text').attr('x', x(t)).attr('y', H - mb + 14).attr('text-anchor', 'middle').attr('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)').text(t);
      svg.append('text').attr('x', ml - 6).attr('y', y(t)).attr('dy', '0.32em').attr('text-anchor', 'end').attr('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)').text(t);
    });
    svg.append('text').attr('x', (ml + W - mr) / 2).attr('y', H - 4).attr('text-anchor', 'middle').attr('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)').text('취약성 →');
    svg.append('text').attr('transform', `translate(10,${(mt + H - mb) / 2}) rotate(-90)`).attr('text-anchor', 'middle').attr('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)').text('스트레스 →');
    svg.append('line').attr('x1', x(fT)).attr('x2', x(fT)).attr('y1', mt).attr('y2', H - mb).style('stroke', 'var(--cds-chart-reference)').attr('stroke-dasharray', '4 4');
    svg.append('line').attr('x1', ml).attr('x2', W - mr).attr('y1', y(sT)).attr('y2', y(sT)).style('stroke', 'var(--cds-chart-reference)').attr('stroke-dasharray', '4 4');
    const q = [['안정', ml + 4, H - mb - 6, 'start'], ['취약·안일', W - mr - 4, H - mb - 6, 'end'], ['충격', ml + 4, mt + 12, 'start'], ['위기', W - mr - 4, mt + 12, 'end']];
    q.forEach(([t, xx, yy, a]) => svg.append('text').attr('x', xx).attr('y', yy).attr('text-anchor', a).attr('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)').text(t));
    const trail = rows.slice(-126).filter((r) => ok(r.stress) && ok(r.fragility));
    svg.append('path').datum(trail).attr('d', d3.line().x((r) => x(r.fragility)).y((r) => y(r.stress))).attr('fill', 'none')
      .style('stroke', dash.colors[0]).attr('stroke-opacity', 0.35).attr('stroke-width', 1.2);
    const tip = tipFor(el);
    svg.append('g').selectAll('circle').data(trail).join('circle').attr('cx', (r) => x(r.fragility)).attr('cy', (r) => y(r.stress))
      .attr('r', (r, i) => (i === trail.length - 1 ? 7 : 2.6)).style('fill', (r, i) => (i === trail.length - 1 ? regColor(r.regime) : dash.colors[0]))
      .attr('fill-opacity', (r, i) => (i === trail.length - 1 ? 1 : 0.15 + 0.6 * i / trail.length))
      .style('stroke', (r, i) => (i === trail.length - 1 ? 'var(--color-fg)' : 'none'))
      .on('pointerenter', (ev, r) => {
        tip.replaceChildren();
        const d = document.createElement('div'); d.className = 'd'; d.textContent = r.ds + ' · ' + r.regime; tip.appendChild(d);
        tipLine(tip, null, '스트레스', f1(r.stress)); tipLine(tip, null, '취약성', f1(r.fragility));
        const s = el.clientWidth / W; placeTip(el, tip, x(r.fragility) * s, y(r.stress) * s);
      })
      .on('pointerleave', () => { tip.hidden = true; });
  }

  function drawAlerts(table) {
    const g = gate(table.parentElement, ['alerts']);
    if (!g) { table.querySelector('tbody').replaceChildren(); return; }
    fillTable(table, g[0].data, [
      { f: 'level_kr', render: (td, r) => { const s = document.createElement('span'); s.className = 'mrm-pill ' + ({ high: 'bad', medium: 'warn' }[r.level] || ''); s.textContent = r.level_kr; td.appendChild(s); } },
      { f: 'message' },
      { f: 'value', num: true, fmt: (v) => { const n = N(v); return ok(n) ? (Math.abs(n) < 1 ? f3(n) : f1(n)) : ''; } },
    ], (r) => r.id);
  }

  function drawHold(el, page) {
    const t2 = dash.data('top2');
    setAll(page, '.k-top2', t2.status === 'ok' ? p1(N(t2.data[0].share)) : '—');
    const g = gate(el, ['top_holdings']);
    if (!g) return;
    el.replaceChildren();
    const rows = g[0].data;
    const mx = d3.max(rows, (r) => N(r.weight));
    rows.forEach((r, i) => barRow(el, r.name, p1(N(r.weight)), N(r.weight) / mx * 100, i < 2 ? dash.colors[0] : 'var(--cds-chart-muted)', NaN));
  }

  let SIG = { key: 'pct', dir: 'desc', q: '' };
  function drawSignals(table) {
    const g = gate(table.parentElement, ['signals']);
    if (!g) { table.querySelector('tbody').replaceChildren(); return; }
    let rows = g[0].data;
    const q = SIG.q.trim().toLowerCase();
    if (q) rows = rows.filter((r) => [r.label, r.category_label, r.axis, r.use, r.name].join(' ').toLowerCase().includes(q));
    rows = sortRows(rows, SIG.key, SIG.dir);
    table.querySelectorAll('th').forEach((th) => th.setAttribute('aria-sort', th.dataset.field === SIG.key ? (SIG.dir === 'asc' ? 'ascending' : 'descending') : 'none'));
    const aucFmt = (v) => { const n = N(v); return ok(n) ? f2(n) : '—'; };
    fillTable(table, rows, [
      { f: 'label' },
      { f: 'category_label', hide: true },
      { f: 'axis', hide: true },
      { f: 'use', hide: true },
      { f: 'raw', num: true, hide: true, fmt: (v) => { const n = N(v); return ok(n) ? (Math.abs(n) < 1 ? f3(n) : f2(n)) : '—'; } },
      { f: 'pct', num: true, render: (td, r) => {
        const v = N(r.pct);
        const b = document.createElement('span'); b.className = 'mrm-cellbar';
        b.style.width = (ok(v) ? v * 0.4 : 0) + 'px';
        b.style.background = v >= 90 ? 'var(--cds-chart-status-critical)' : dash.colors[r.axis === '취약성' ? 1 : 0];
        td.append(b, document.createTextNode(show(v, f1)));
      } },
      { f: 'change_5d', num: true, fmt: (v) => show(N(v), s1) },
      { f: 'test_dd', num: true, fmt: aucFmt },
      { f: 'test_vol', num: true, hide: true, fmt: aucFmt },
    ], (r) => r.name);
  }

  function drawFresh(table) {
    const g = gate(table.parentElement, ['freshness']);
    if (!g) { table.querySelector('tbody').replaceChildren(); return; }
    fillTable(table, g[0].data, [{ f: 'series' }, { f: 'last_obs' }, { f: 'note', hide: true }], (r) => enc(r.series) + ',' + enc(r.last_obs));
  }

  // ---------- HISTORY page ----------
  let RANGE = '2025-07-01';
  function sliceRange(rows) {
    if (RANGE === 'all') return rows;
    const end = rows[rows.length - 1].date;
    let start;
    if (RANGE === '3y') start = d3.utcYear.offset(end, -3);
    else if (RANGE === '10y') start = d3.utcYear.offset(end, -10);
    else start = new Date(RANGE + 'T00:00:00Z');
    return rows.filter((r) => r.date >= start);
  }
  function thin(rows, maxN) {
    if (rows.length <= maxN) return rows;
    const step = Math.ceil(rows.length / maxN);
    return rows.filter((r, i) => i % step === 0 || i === rows.length - 1);
  }
  function drawHistory(page) {
    page.querySelectorAll('#range-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.r === RANGE)));
    const leg = page.querySelector('#reg-legend');
    leg.replaceChildren(...REG.map((r) => { const s = document.createElement('span'); const i = document.createElement('i'); i.style.background = regColor(r); i.style.opacity = '.5'; s.append(i, document.createTextNode(r)); return s; }));
    const idxEl = page.querySelector('#idx-chart');
    if (gate(idxEl, ['history'])) {
      const rows = sliceRange(histRows());
      lineChart(idxEl, { rows, height: 260, log: true, y: d3.extent(rows, (r) => r.kospi).map((v, i) => v * (i ? 1.06 : 0.94)), yFmt: d3.format(',.0f'), bands: true,
        series: [{ key: 'kospi', label: 'KOSPI', color: 'var(--color-fg)', fmt: d3.format(',.0f') }] });
    }
    const scEl = page.querySelector('#score-chart');
    const g2 = gate(scEl, ['history', 'kpi']);
    if (g2) {
      const k = g2[1].data[0];
      const rows = thin(sliceRange(histRows()), 2500);

  function marketState(tz, open, close) {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', weekday: 'short', hour12: false })
      .formatToParts(new Date());
    const g = (t) => (parts.find((p) => p.type === t) || {}).value;
    const hm = `${g('hour')}:${g('minute')}`.replace(/^24/, '00');
    const isOpen = !['Sat', 'Sun'].includes(g('weekday')) && hm >= open && hm < close;
    return { hm, isOpen };
  }
  function startClocks() {
    const tick = () => document.querySelectorAll('.clk').forEach((c) => {
      const m = marketState(c.dataset.tz, c.dataset.open, c.dataset.close);
      c.querySelector('.clk-time').textContent = m.hm;
      const st = c.querySelector('.clk-state');
      st.textContent = m.isOpen ? '장중' : '장 마감';
      st.className = 'clk-state' + (m.isOpen ? ' on' : '');
    });
    tick();
    setInterval(tick, 15000);
  }

  const arrow = (v) => (v > 0 ? '▲' : (v < 0 ? '▼' : '■'));

  function chg(el, v, fmt, suffix, risk) {

    const s = document.createElement('span');
    s.className = risk ? (v > 0 ? 'down' : (v < 0 ? 'up' : '')) : updn(v);
    s.textContent = `${arrow(v)} ${fmt(Math.abs(v))}`;
    el.appendChild(s);
    if (suffix) el.appendChild(document.createTextNode(suffix));

  function drawBoard(page) {
    const kd = dash.data('kpi');
    const k = kd.status === 'ok' ? kd.data[0] : null;
    if (!k) return;
    page.querySelector('#bd-regime').textContent = k.regime;
    page.querySelector('#bd-hero').style.setProperty('--regime', regColor(k.regime));
    txt('bd-asof', `(${k.asof} 종가 기준)`);
    const QD = { '위기(Crisis)': '스트레스와 구조적 취약성이 모두 높은', '충격(Shock)': '스트레스는 높지만 구조적 취약성은 낮은',
      '취약·안일(Fragile)': '겉으로는 조용하지만 구조적 취약성이 쌓인', '안정(Calm)': '스트레스와 취약성이 모두 낮은' };
    const comp = N(k.composite), cutD = N(k.cut_danger), cutA = N(k.cut_alert), cutW = N(k.cut_watch);
    const next = comp < cutW ? ['주의', cutW] : comp < cutA ? ['경계', cutA] : comp < cutD ? ['위험', cutD] : null;
    const line = page.querySelector('#bd-line');
    line.replaceChildren();
    const add = (t, b) => { const n = document.createElement(b ? 'b' : 'span'); n.textContent = t; line.appendChild(n); };
    add(`${QD[k.quadrant] || ''} ${String(k.quadrant).replace(/\(.*\)/, '')} 국면입니다. `);
    if (next) { add(`${next[0]} 단계까지 `); add(`${f1(next[1] - comp)}점`, true); add(' 남았습니다. '); }
    else add('가장 높은 단계입니다. ');
    add('수익률 방향이 아니라 흔들림의 크기를 재는 판입니다.');

    txt('ctr-comp', f1(comp));
    chg(page.querySelector('#ctr-comp-sub'), comp - N(k.composite_5d_ago), f1, ' 5거래일 대비', true);
    txt('ctr-st', f1(N(k.stress)));
    chg(page.querySelector('#ctr-st-sub'), N(k.stress) - N(k.stress_5d_ago), f1, ' 5거래일 대비', true);
    txt('ctr-fr', f1(N(k.fragility)));
    chg(page.querySelector('#ctr-fr-sub'), N(k.fragility) - N(k.fragility_5d_ago), f1, ' 5거래일 대비', true);
    txt('ctr-p', p0(N(k.prob_calibrated)));
    txt('ctr-p-sub', `평상시 ${p0(N(k.base_rate_holdout))}`);
    txt('ctr-v', p0(N(k.vol_forecast)));
    txt('ctr-v-sub', `하루 VaR 95% ${p1(N(k.var95_1d))}`);
    txt('ctr-k', cm0(N(k.index_level)));
    chg(page.querySelector('#ctr-k-sub'), N(k.index_ret_1d), pct, `, 1년 고점 대비 ${p1(N(k.drawdown_1y))}`);

    drawCrawl(page, k);
    drawKrTop(page);
    drawKrMove(page);
    drawNews(page);
  }

  function drawCrawl(page, k) {
    const tr = page.querySelector('#bd-crawl-track');
    const items = [{ tag: '레짐', text: `${k.regime}, 종합 ${f1(N(k.composite))}점, 63일 안 −10% 확률 ${p0(N(k.prob_calibrated))}` }];
    const b = dash.data('breadth');
    if (b.status === 'ok' && b.data.length) {
      const r = b.data[0];
      items.push({ tag: '시장 폭', text: `▲ 상승 ${r.up}   ▼ 하락 ${r.down}   ■ 보합 ${r.flat}` });
    }
    const al = dash.data('alerts');
    (al.status === 'ok' ? al.data : []).filter((a) => a.level !== 'info').forEach((a) =>
      items.push({ tag: '경보', text: a.message, cls: a.level === 'high' ? 'hi' : 'md' }));
    const nw = dash.data('news');
    (nw.status === 'ok' ? nw.data : []).slice(0, 10).forEach((n) => items.push({ tag: n.topic, text: n.title }));
    tr.replaceChildren(...items.map((it) => {
      const s = document.createElement('span');
      if (it.cls) s.className = it.cls;
      const t = document.createElement('span'); t.className = 'tag'; t.textContent = it.tag;
      s.append(t, document.createTextNode(it.text));
      return s;
    }));
    const len = items.reduce((a, it) => a + it.text.length + it.tag.length, 0);
    tr.style.setProperty('--crawl-dur', `${Math.max(40, Math.round(len * 0.32))}s`);
  }

  function ledRow(tb, name, price, change, extra) {
    const tr = document.createElement('tr');
    const a = document.createElement('td'); a.className = 'nm'; a.textContent = name; a.title = name;
    const p = document.createElement('td'); p.className = 'px'; p.textContent = ok(price) ? cm0(price) : '—';
    const c = document.createElement('td'); c.className = 'ch'; chg(c, change, pct);
    tr.append(a, p, c);
    if (extra !== undefined) { const w = document.createElement('td'); w.className = 'wt'; w.textContent = extra; tr.appendChild(w); }
    tb.appendChild(tr);
  }
  function sepRow(tb, label, cols) {
    const tr = document.createElement('tr'); tr.className = 'sep';
    const td = document.createElement('td'); td.colSpan = cols; td.textContent = label;
    tr.appendChild(td); tb.appendChild(tr);
  }
  function drawKrTop(page) {
    const tb = page.querySelector('#kr-top tbody');
    const d = dash.data('top_holdings');
    tb.replaceChildren();
    if (d.status !== 'ok' || !d.data.length) { sepRow(tb, '데이터가 없습니다. 다음 업데이트 때 채워집니다.', 4); return; }
    const b = dash.data('breadth');
    if (b.status === 'ok' && b.data.length) txt('kr-date', `${b.data[0].date} 종가, 비중은 코스피 보통주 시총 대비`);
    d.data.forEach((r) => ledRow(tb, r.name, N(r.close), N(r.ret_1d), p1(N(r.weight))));
  }
  function drawKrMove(page) {
    const bx = page.querySelector('#kr-breadth');
    const b = dash.data('breadth');
    bx.replaceChildren();
    if (b.status === 'ok' && b.data.length) {
      const r = b.data[0];
      const tot = N(r.up) + N(r.down) + N(r.flat);
      const bar = document.createElement('div'); bar.className = 'breadth-bar';
      bar.setAttribute('role', 'img');
      bar.setAttribute('aria-label', `상승 ${r.up}, 보합 ${r.flat}, 하락 ${r.down}`);
      [['up', 'var(--up)'], ['flat', 'var(--led-dim)'], ['down', 'var(--down)']].forEach(([key, col]) => {
        const i = document.createElement('i'); i.style.background = col; i.style.flex = String(N(r[key]) / tot); bar.appendChild(i);
      });
      const lab = document.createElement('div'); lab.className = 'breadth-lab';
      const u = document.createElement('span'); u.className = 'up'; u.textContent = `▲ 상승 ${r.up}`;
      const f = document.createElement('span'); f.textContent = `■ 보합 ${r.flat}`;
      const dn = document.createElement('span'); dn.className = 'down'; dn.textContent = `▼ 하락 ${r.down}`;
      lab.append(u, f, dn);
      bx.append(bar, lab);
    }
    const tb = page.querySelector('#kr-move tbody');
    const d = dash.data('movers');
    tb.replaceChildren();
    if (d.status !== 'ok' || !d.data.length) return;
    sepRow(tb, '급등', 3);
    d.data.filter((r) => r.side === 'gainer').forEach((r) => ledRow(tb, r.name, N(r.close), N(r.ret_1d)));
    sepRow(tb, '급락', 3);
    d.data.filter((r) => r.side === 'loser').forEach((r) => ledRow(tb, r.name, N(r.close), N(r.ret_1d)));
  }
  function drawNews(page) {
    const ul = page.querySelector('#news-list');
    const d = dash.data('news');
    ul.replaceChildren();
    if (d.status !== 'ok' || !d.data.length) {
      const p = document.createElement('li'); p.className = 'news-empty'; p.style.display = 'block';
      p.textContent = '아직 받아온 헤드라인이 없습니다. GitHub Actions가 다음에 실행될 때(평일 아침 7:30) 채워집니다.';
      ul.appendChild(p);
      return;
    }
    d.data.slice(0, 24).forEach((n) => {
      const li = document.createElement('li');
      const t = document.createElement('span'); t.className = 't'; t.textContent = String(n.published || '').slice(11, 16) || '—';
      const a = document.createElement('a'); a.href = n.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = n.title;
      const s = document.createElement('span'); s.className = 'src'; s.textContent = `${n.topic}  ${n.source || ''}`;
      li.append(t, a, s);
      ul.appendChild(li);
    });
  }

  // ---------- tabs ----------
  const built = {};
  const drawers = { board: drawBoard, now: drawNow, history: drawHistory, validation: drawValidation, method: () => {} };
  let active = null;
  function build(id) {
    if (built[id]) return;
    const page = document.getElementById(id);
    page.appendChild(document.getElementById('tpl-' + id).content.cloneNode(true));
    built[id] = true;
    if (id === 'board') buildBoardWidgets(page);
    if (id === 'now') {
      page.querySelector('#sig-search').addEventListener('input', (e) => { SIG.q = e.target.value; drawSignals(page.querySelector('#sig-table')); });
      page.querySelectorAll('#sig-table th button').forEach((b) => b.addEventListener('click', () => {
        const k = b.dataset.k;
        SIG = { ...SIG, key: k, dir: SIG.key === k && SIG.dir === 'desc' ? 'asc' : 'desc' };
        drawSignals(page.querySelector('#sig-table'));
      }));
    }
    if (id === 'history') {
      page.querySelectorAll('#range-seg button').forEach((b) => b.addEventListener('click', () => { RANGE = b.dataset.r; drawHistory(page); }));
    }
    if (id === 'validation') {
      page.querySelectorAll('#rs-seg button').forEach((b) => b.addEventListener('click', () => { SAMPLE = b.dataset.s; drawValidation(page); }));
    }
  }
  function showTab(id, link) {
    if (!drawers[id]) id = 'board';
    active = id;
    build(id);
    document.querySelectorAll('.mrm-tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
    document.querySelectorAll('.mrm-page').forEach((p) => { p.hidden = p.id !== id; });
    if (link) dash.setLink(id);
    drawers[id](document.getElementById(id));
    drawHeader();
  }
  document.querySelectorAll('.mrm-tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab, true)));
  startClocks();
  tvWidget(document.getElementById('tv-tape'), 'ticker-tape', { symbols: BOARD.tape, showSymbolLogo: false, isTransparent: true, displayMode: 'regular', colorTheme: 'dark', locale: 'kr' });
  showTab(location.hash.slice(1) || 'board', false);
  window.addEventListener('hashchange', () => showTab(location.hash.slice(1) || 'board', false));

  dash.onData(() => {
    drawHeader();
    if (active) drawers[active](document.getElementById(active));
  });
})();
</script>
</body>
</html>
